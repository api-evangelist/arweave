name: Arweave
description: Arweave is a permanent decentralized data storage network that enables
  developers to store data forever with a single upfront payment. It provides REST
  and GraphQL APIs for uploading data, querying blocks and transactions by tags and
  metadata, retrieving wallet balances, and accessing the permaweb data ecosystem.
  The network uses the AR token for storage fees and supports bundled uploads via
  the Turbo service with fiat and multi-chain crypto payment options.
accessModel:
  pricing: free
  onboarding: unknown
  trial: false
  try_now: false
  public: false
