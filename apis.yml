apis:
- name: Arweave GraphQL API
  description: >-
    GraphQL API for querying Arweave transaction and block metadata by tags, owner addresses, recipients,
    block height ranges, and transaction IDs. Supports cursor-based pagination and sorting. Primary endpoints
    are hosted at arweave.net/graphql and high-performance alternatives at arweave-search.goldsky.com/graphql.
    Use GraphQL to find transaction IDs, then use the REST API to fetch the actual data.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://gql-guide.vercel.app/
  baseURL: https://arweave.net/graphql
  tags:
  - GraphQL
  - Transactions
  - Blocks
  - Tags
  - Search
  properties:
  - type: Documentation
    url: https://gql-guide.vercel.app/
  - type: GraphQL
    url: https://arweave.net/graphql
  - url: >-
      https://raw.githubusercontent.com/api-evangelist/arweave/refs/heads/main/graphql/arweave-schema.graphql
    type: GraphQLSchema
  - url: >-
      https://raw.githubusercontent.com/api-evangelist/arweave/refs/heads/main/graphql/arweave-graphql.md
    type: GraphQLDocumentation
- name: Arweave Turbo Upload API
  description: >-
    Managed bundling upload service (ar.io Turbo) that implements ANS-104 bundling for high-throughput
    data uploads to Arweave. Handles millions of uploads daily with automatic retry, sub-100 KiB free
    tier, and payment via credit card, AR, ETH, SOL, MATIC, USDC, and KYVE. Uploads are priced per byte
    with dynamic rates tracking the AR token and Arweave network storage cost.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.ar.io/build/upload/bundling-services
  baseURL: https://turbo.ardrive.io
  tags:
  - Upload
  - Bundling
  - ANS-104
  - Storage
  properties:
  - type: Documentation
    url: https://docs.ar.io/build/upload/bundling-services
  - type: PricingPage
    url: https://docs.ar.io/build/upload/turbo-credits
