  /x402/upload/unsigned:
    servers:
    - url: /v1
    - url: /
    post:
      summary: Posts raw data with x402 payment (bundler creates ANS-104 wrapper)
      description: '**x402-Specific Upload Endpoint for Raw Data (Server-Signed)**


        This endpoint accepts raw data (images, files, text, etc.) and the bundler creates and signs

        the ANS-104 data item wrapper server-side. Payment is via x402 USDC. **Use Case:** AI agents, simple apps, and clients that don''t want to implement ANS-104 signing. ---


        ## Payment Flow


        ```

        1. POST raw data (no X-PAYMENT header)

        ↓

        2. Server returns 402 with payment requirements

        ↓

        3. Client creates EIP-3009 authorization + EIP-712 signature

        ↓

        4. POST raw data WITH X-PAYMENT header

        ↓

        5. Server: verify → settle USDC → create data item → store → return receipt

        ```


        ---


        ## Pricing


        **Formula:**

        ```

        estimatedSize = rawDataSize + 512 (signature) + 512 (owner) + 80 (headers) + (totalTags × 64)

        winstonCost = arweaveGateway.getPrice(estimatedSize)

        usdcAmount = (winstonCost / 10^12) × arPriceUSD × 10^6 × (1 + feePercent/100)

        ```


        **Fee:** Configurable via X402_FEE_PERCENT (default: 15%); X402_PRICING_BUFFER_PERCENT is the deprecated fallback


        **Get price quote first:** `GET /v1/price/x402/data/{token}/{byteCount}?tags={n}&contentType={mime}`


        ---


        ## System Tags (Automatically Added)


        | Tag | Description | Example |

        |-----|-------------|---------|

        | Bundler | Service name | "AR.IO Bundler" |

        | Upload-Type | Upload method | "raw-data-x402" |

        | Payer-Address | Ethereum payer | "0x742d35Cc..." |

        | X402-TX-Hash | Blockchain tx | "0x9c31110e..." |

        | X402-Payment-ID | Tracking UUID | "edd4766e-..." |

        | X402-Network | Payment network | "base" |

        | Upload-Timestamp | Unix ms | "1700590909589" |

        | Content-Type | MIME type | "image/png" |


        ---


        ## Custom Tags


        **Via Headers:** `X-Tag-App-Name: MyApp` → `{"name": "App-Name", "value": "MyApp"}`


        **Via a JSON header:** `x-data-item-tags: [{"name": "App-Name", "value": "MyApp"}]`, as @ardrive/turbo-sdk sends. A value that is not a JSON array of `{name, value}` strings is refused with 400 before any payment; an empty value is ignored. Header values are Latin-1, an HTTP limit: send other text in the envelope. **Via JSON Envelope:** `{"data": "...", "tags": [{"name": "App-Name", "value": "MyApp"}]}`


        Note: Header tag names are converted from kebab-case to Proper-Case. Tags from every source are kept, in this order: the envelope''s, `x-data-item-tags`, then `X-Tag-*`. The item''s Content-Type comes from one explicit source: a `Content-Type` tag (any case) or the envelope''s `contentType`. More than one is refused with 400, even when they agree. With neither, a binary upload uses the request''s Content-Type unless it is `application/octet-stream`, and an envelope gets none. An empty value counts as absent. A JSON body is read as an envelope when `data` is a non-empty string and every other key is an envelope key (`tags`, `contentType`, and the unused `target` and `anchor`). `data` can be standard or url-safe base64, with or without padding or line breaks. Any other JSON body, such as a document with its own `data` field and other keys, is stored byte for byte. An envelope whose `data` is not base64, whose `tags` are not `{name, value}` strings, or whose `contentType`, `target` or `anchor` is not a string is refused with 400 before any payment. A `null` optional field counts as absent. ---


        ## Important Notes


        - **Ownership:** The `owner` field is the bundler''s server wallet. The payer''s address is recorded in the `Payer-Address` tag only. - **Server Requirement:** Requires `RAW_DATA_UPLOADS_ENABLED=true` on server

        - **Max Size:** the request body is limited to `MAX_DATA_ITEM_SIZE` bytes (default 4 GiB); a larger body answers 413. A JSON envelope carries base64, about 4/3 the size of the data, so its data can be at most about 3/4 of that limit. - **Max Tags:** 4096 serialized tag bytes for the whole item, including the Content-Type tag and the 7 system tags this bundler adds. Checked before payment.'
      tags:
      - Upload
      parameters:
      - $ref: '#/components/parameters/content-length'
      - name: Content-Type
        in: header
        description: MIME type of the raw data (e.g., image/png, application/pdf)
        required: false
        schema:
          type: string
          example: image/png
      - $ref: '#/components/parameters/x-payment'
      - name: x-data-item-tags
        in: header
        description: 'Tags as a JSON array of `{"name": string, "value": string}` objects.

          Malformed values are refused with 400 before any payment; an empty

          value is ignored. Header values are Latin-1 (an HTTP limit).

          '
        required: false
        schema:
          type: string
          example: '[{"name":"Content-Type","value":"application/json"},{"name":"App-Name","value":"MyApp"}]'
      - name: X-TAG-*
        in: header
        description: 'Custom tags in the format X-TAG-Name: Value.

          Multiple tags can be specified. Tag names are case-insensitive.

          '
        required: false
        schema:
          type: string
        examples:
          AppName:
            summary: Application name tag
            value: MyApp
          Version:
            summary: Version tag
            value: 1.0.0
      requestBody:
        required: true
        description: 'Raw data to upload. Supports two formats:


          **1. Binary Upload (Recommended for files)**

          - Content-Type: application/octet-stream, image/png, application/pdf, etc.

          - Body: Raw binary data

          - Custom tags via X-Tag-* headers


          **2. JSON Envelope (Alternative for programmatic use)**

          - Content-Type: application/json

          - Body: `{"data": "<base64>", "contentType": "...", "tags": [...]}`

          - Useful when headers are difficult to set (e.g., some HTTP clients)

          '
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw binary data (use X-Tag-* headers for custom tags)
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              description: 'JSON envelope format for raw data uploads.

                Use this when you can''t easily set X-Tag-* headers.

                '
              required:
              - data
              properties:
                data:
                  type: string
                  format: byte
                  description: Base64-encoded raw data
                  example: SGVsbG8gV29ybGQh
                contentType:
                  type: string
                  description: MIME type of the data (adds Content-Type tag)
                  example: image/png
                tags:
                  type: array
                  description: Custom tags to add to the data item (no count limit; the item's tags, with the Content-Type and system tags, must fit in 4096 bytes)
                  items:
                    type: object
                    required:
                    - name
                    - value
                    properties:
                      name:
                        type: string
                        description: Tag name
                        example: App-Name
                      value:
                        type: string
                        description: Tag value
                        example: MyApp
            examples:
              SimpleText:
                summary: Simple text upload
                value:
                  data: SGVsbG8gV29ybGQh
                  contentType: text/plain
              WithTags:
                summary: Upload with custom tags
                value:
                  data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  contentType: image/png
                  tags:
                  - name: App-Name
                    value: MyApp
                  - name: App-Version
                    value: 1.0.0
      responses:
        '200':
          description: 'The raw data was successfully uploaded and wrapped in an ANS-104 data item.


            **Response includes:**

            - `id`: The data item ID (Arweave transaction ID)

            - `owner`: Server''s raw data item wallet address (signs the data item)

            - `payer`: Ethereum address that paid via x402 (tracked in Payer-Address tag)

            - `receipt`: Signed receipt object with cryptographic proof

            - `x402Payment`: Payment confirmation with blockchain transaction hash

            '
          headers:
            X-Payment-Response:
              schema:
                type: string
                format: byte
              description: 'Base64-encoded x402 payment response containing:

                - paymentId: UUID for tracking

                - transactionHash: Blockchain transaction hash

                - network: Payment network (e.g., "base")

                - mode: Payment mode (always "payg" for x402)

                '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDataUploadResponse'
              examples:
                RawDataUpload:
                  summary: Raw data upload with x402 payment
                  value:
                    id: rNephs2z5BAAUlmZm_TGwQjz4TiMr6HoZNyBO3eLctA
                    owner: jHGQATyLh_yBNKwqPmU-y6qV98q-AB48fIWUiFOSJAA
                    payer: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb0'
                    dataCaches:
                    - arweave.net
                    fastFinalityIndexes:
                    - arweave.net
                    receipt:
                      id: rNephs2z5BAAUlmZm_TGwQjz4TiMr6HoZNyBO3eLctA
                      timestamp: 1700590909589
                      version: 0.2.0
                      deadlineHeight: 1310000
                      dataCaches:
                      - arweave.net
                      fastFinalityIndexes:
                      - arweave.net
                      winc: '1000000'
                      public: qREovbmD6oxgHYNCzOeTei07lSz0-YLcjnvgSDzqpts...
                      signature: iU_S6uuG1OD8k0XqMGOmbcKfysDckEMUy4R9-ODPXiQj...
                    x402Payment:
                      paymentId: edd4766e-a053-47f2-88d1-819e72c534dd
                      transactionHash: '0x9c31110e240805d9dfa5853c661f23a258c89f78b8d2e4424a922f9dfd8748f3'
                      network: base
                      mode: payg
        '400':
          description: Invalid request. Every 400 is answered before any payment settles.
          content:
            text/plain:
              schema:
                type: string
              examples:
                MissingContentLength:
                  summary: Content-Length required with X-PAYMENT
                  value: Content-Length header is required when providing payment
                EmptyData:
                  value: Data cannot be empty
                InvalidPaymentHeader:
                  value: Invalid payment header format
                NetworkNotConfigured:
                  value: Network base-goerli is not configured
                NetworkNotEnabled:
                  value: Network base-sepolia is not enabled
                MalformedTagsHeader:
                  value: 'The x-data-item-tags header must be a JSON array of {"name": string, "value": string} objects'
                EnvelopeDataNotBase64:
                  value: The envelope's data must be base64 (standard or url-safe)
                EnvelopeTagsMalformed:
                  value: 'The envelope''s tags must be an array of {"name": string, "value": string} objects'
                EnvelopeFieldNotString:
                  summary: contentType, target or anchor that is not a string
                  value: The envelope's contentType must be a string
                TwoContentTypes:
                  value: 'Send the Content-Type once, as one Content-Type tag or the envelope''s contentType: it becomes the data item''s Content-Type'
                TagsTooLarge:
