              description: x402 protocol version (set on the JSON bodies)
          content:
            application/json:
              schema:
                type: object
                properties:
                  x402Version:
                    type: integer
                    example: 1
                  accepts:
                    type: array
                    items:
                      type: object
                      properties:
                        scheme:
